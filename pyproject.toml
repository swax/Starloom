[project]
name = "starloom"
version = "0.1.0"
description = "Starlink constellation visualization"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "matplotlib>=3.10.8",
    "openpyxl>=3.1.5",
    "python-dotenv>=1.2.2",
    "requests>=2.32.5",
]

[project.scripts]
starloom = "starloom.cli:main"
test-spacetrack = "starloom.test_spacetrack:main"
